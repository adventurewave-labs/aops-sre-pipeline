# kube-state-metrics — the source of every series the A.O.P.S. alert rules use.
#
# Without this, services/prometheus-alertmanager/config/alert_rules.yml scrapes
# nothing and no alert can ever fire. Pinned, minimal RBAC scoped to the
# resources the rules actually reference.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: kube-system
  labels: {app.kubernetes.io/name: kube-state-metrics}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
  labels: {app.kubernetes.io/name: kube-state-metrics}
rules:
  - apiGroups: [""]
    resources: [nodes, pods, services, persistentvolumeclaims, namespaces]
    verbs: [list, watch]
  - apiGroups: ["apps"]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [list, watch]
  - apiGroups: ["storage.k8s.io"]
    resources: [storageclasses]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
  labels: {app.kubernetes.io/name: kube-state-metrics}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: kube-system
  labels: {app.kubernetes.io/name: kube-state-metrics}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kube-state-metrics}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kube-state-metrics}
    spec:
      serviceAccountName: kube-state-metrics
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          ports:
            - {name: http-metrics, containerPort: 8080}
            - {name: telemetry, containerPort: 8081}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 200m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            capabilities: {drop: ["ALL"]}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            timeoutSeconds: 5
          readinessProbe:
            httpGet: {path: /, port: 8081}
            initialDelaySeconds: 5
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: kube-system
  labels: {app.kubernetes.io/name: kube-state-metrics}
spec:
  type: NodePort
  selector: {app.kubernetes.io/name: kube-state-metrics}
  ports:
    - {name: http-metrics, port: 8080, targetPort: 8080, nodePort: 30081}
    - {name: telemetry, port: 8081, targetPort: 8081}
