global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'aops-demo'

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - 'alertmanager:9093'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # If running against a real kind cluster, scrape kube-state-metrics
  # and node-exporter for real metrics.
  - job_name: 'kube-state-metrics'
    static_configs:
      - targets: ['kube-state-metrics:8080']
    scrape_interval: 30s
