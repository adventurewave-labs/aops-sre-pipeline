# A.O.P.S. stack — REAL Automated Off-the-shelf Pipeline SRE.
#
# This compose file wires REAL components together:
#
#   Real Prometheus (port 9090) + Alertmanager (port 9093)
#        ↓ Alertmanager webhook
#   Real n8n (port 5678)                [workflow imported by the n8n-import step]
#        ↓ HTTP POST
#   Popeye scanner (port 8004)           [real Popeye binary, falls back to built-in]
#        ↓ Popeye JSON
#   dify-lite (port 8002)               [agentic reasoning → real Ollama LLM]
#        ↓ OpenAI-compat
#   Ollama (port 11434)                  [real LLM: qwen2.5:0.5b or llama3.1:8b]
#        ↓ remediation text
#   Slack receiver (port 8003)           [real webhook OR mock-slack fallback]
#        ↓ POST /remediate
#   Remediation executor (port 8005)    [applies real kubectl fixes, re-scans]
#
# MODES:
#   docker compose --profile sandbox up -d        # fixtures only, no cluster needed
#   docker compose -f docker-compose.yml -f docker-compose.real.yml up -d
#                                                 # real mode: needs a kind cluster
#                                                 # (run scripts/setup-kind-cluster.sh up first)
#   REAL_SLACK_WEBHOOK_URL=https://... docker compose up -d  # real Slack
#
# The base file is sandbox-safe on purpose: it does not reference the external
# `kind` docker network, so it comes up on a machine with no cluster at all.
# docker-compose.real.yml is the overlay that joins the cluster network and
# switches the scanner to live-cluster provenance.
#
# The mock-k8s-api service is only used when AOPS_MODE=sandbox, which is the
# default here. Apply docker-compose.real.yml to switch Popeye and the
# remediation executor to a real cluster via kubeconfig.

services:

  # ------------------------------------------------------------------
  # Mock K8s API — the sandbox fixture server (profile: sandbox).
  # In real mode this service is not started; the scanner and the
  # remediation executor read the cluster through the mounted kubeconfig.
  # ------------------------------------------------------------------
  mock-k8s-api:
    build: ./services/mock-k8s-api
    image: aops/mock-k8s-api:0.2
    container_name: aops-mock-k8s-api
    profiles: ["sandbox"]
    ports: ["8001:8001"]
    environment:
      MOCK_K8S_HOST: "0.0.0.0"
      MOCK_K8S_PORT: "8001"
      MOCK_K8S_TOKEN: "aops-demo-token"
      MOCK_K8S_DISABLE_AUTH: "0"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [aops-net]

  # ------------------------------------------------------------------
  # Popeye scanner — uses REAL Popeye binary when available
  # ------------------------------------------------------------------
  popeye-scanner:
    build: ./services/popeye-scanner
    image: aops/popeye-scanner:0.2
    container_name: aops-popeye-scanner
    ports: ["8004:8004"]
    environment:
      POPEYE_HOST: "0.0.0.0"
      POPEYE_PORT: "8004"
      POPEYE_MODE: "${POPEYE_MODE:-real}"
      AOPS_NAMESPACE: "payment-prod"
      # In sandbox mode, point at the mock K8s API
      MOCK_K8S_URL: "http://mock-k8s-api:8001"
      MOCK_K8S_TOKEN: "aops-demo-token"
      # Provenance switch — see services/popeye-scanner/scanner.py.
      # sandbox = mock fixtures (labelled as such); real = live cluster.
      AOPS_MODE: "${AOPS_MODE:-sandbox}"
      KUBECONFIG: "/root/.kube/config"
    volumes:
      # MUST be the *internal* kubeconfig (server: https://<cluster>-control-plane:6443).
      # scripts/setup-kind-cluster.sh writes it to .kubeconfig.internal — a host
      # kubeconfig pointing at 127.0.0.1 resolves to this container, not the cluster.
      - ${KUBECONFIG_PATH:-./.kubeconfig.internal}:/root/.kube/config:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [aops-net]

  # ------------------------------------------------------------------
  # Real Ollama LLM backend
  # ------------------------------------------------------------------
  ollama:
    image: ollama/ollama:0.3.12
    container_name: aops-ollama
    ports: ["11434:11434"]
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:11434/api/tags || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits:
          memory: 2g
    networks: [aops-net]

  ollama-pull:
    image: ollama/ollama:0.3.12
    container_name: aops-ollama-pull
    depends_on:
      ollama:
        condition: service_started
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:0.5b}"
    entrypoint: ["sh", "-c"]
    command: >
      "ollama pull ${OLLAMA_MODEL:-qwen2.5:0.5b} && echo 'model pulled successfully'"
    volumes:
      - ollama-models:/root/.ollama
    networks: [aops-net]
    restart: "no"

  # ------------------------------------------------------------------
  # dify-lite — agentic reasoning, defaults to REAL Ollama
  # ------------------------------------------------------------------
  dify-lite:
    build: ./services/dify-lite
    image: aops/dify-lite:0.2
    container_name: aops-dify-lite
    ports: ["8002:8002"]
    depends_on:
      ollama:
        condition: service_started
    environment:
      DIFY_LITE_HOST: "0.0.0.0"
      DIFY_LITE_PORT: "8002"
      AOPS_LLM_BACKEND: "${AOPS_LLM_BACKEND:-ollama}"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:0.5b}"
      MOCK_K8S_URL: "http://mock-k8s-api:8001"
      MOCK_K8S_TOKEN: "aops-demo-token"
      AOPS_MAX_AGENT_ROUNDS: "${AOPS_MAX_AGENT_ROUNDS:-2}"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [aops-net]

  # ------------------------------------------------------------------
  # Slack receiver — supports real Slack webhook OR local mock
  # ------------------------------------------------------------------
  slack-receiver:
    build: ./services/mock-slack
    image: aops/slack-receiver:0.2
    container_name: aops-slack-receiver
    ports: ["8003:8003"]
    environment:
      MOCK_SLACK_HOST: "0.0.0.0"
      MOCK_SLACK_PORT: "8003"
      # Set REAL_SLACK_WEBHOOK_URL to use real Slack instead of local mock
      REAL_SLACK_WEBHOOK_URL: "${REAL_SLACK_WEBHOOK_URL:-}"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [aops-net]

  # ------------------------------------------------------------------
  # Real n8n — workflow executor; the workflow is imported by n8n-import
  # ------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: aops-n8n
    ports: ["5678:5678"]
    depends_on:
      n8n-import:
        condition: service_completed_successfully
      popeye-scanner:
        condition: service_healthy
      dify-lite:
        condition: service_healthy
      slack-receiver:
        condition: service_healthy
    environment:
      N8N_HOST: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_PROTOCOL: "http"
      WEBHOOK_URL: "http://n8n:5678/"
      N8N_SECURE_COOKIE: "false"
      # NOTE: n8n has no import-on-boot environment variable. The workflow is
      # imported and activated by the `n8n-import` one-shot service below,
      # which runs `n8n import:workflow` against the shared /home/node/.n8n
      # volume before n8n starts serving.
      # Environment variables the n8n workflow nodes will reference
      POPEYE_URL: "http://popeye-scanner:8004"
      DIFY_LITE_URL: "http://dify-lite:8002"
      SLACK_WEBHOOK_URL: "http://slack-receiver:8003/webhook/slack"
      REMEDIATION_URL: "http://remediation-executor:8005"
      OLLAMA_MODEL: "${OLLAMA_MODEL:-qwen2.5:0.5b}"
    volumes:
      - ./services/n8n-runner/aops-workflow.json:/data/n8n-workflow.json:ro
      - n8n-data:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5678/healthz || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [aops-net]

  # ------------------------------------------------------------------
  # One-shot: import + activate the A.O.P.S. workflow into real n8n.
  #
  # This is the step that makes the Alertmanager webhook resolve. Without it
  # n8n boots with zero workflows and POST /webhook/aops-alert returns 404.
  # ------------------------------------------------------------------
  n8n-import:
    image: n8nio/n8n:latest
    container_name: aops-n8n-import
    user: node
    entrypoint: ["/bin/sh", "-c"]
    # `update:workflow --all --active=true` is deprecated and a no-op on
    # current n8n ("publishing via --all is no longer supported"), so the
    # workflow imported but was never published and the webhook 404'd.
    # Publish by id, falling back to the old flag for older n8n images.
    command: >
      "n8n import:workflow --input=/data/n8n-workflow.json &&
       { n8n publish:workflow --id=aopsRemediation1 ||
         n8n update:workflow --id=aopsRemediation1 --active=true; } &&
       echo 'A.O.P.S. workflow imported and published'"
    volumes:
      - ./services/n8n-runner/aops-workflow.json:/data/n8n-workflow.json:ro
      - n8n-data:/home/node/.n8n
    networks: [aops-net]
    restart: "no"

  # ------------------------------------------------------------------
  # Lightweight n8n-runner (Python fallback when real n8n is not desired)
  # ------------------------------------------------------------------
  n8n-runner:
    build: ./services/n8n-runner
    image: aops/n8n-runner:0.2
    container_name: aops-n8n-runner
    profiles: ["sandbox"]
    ports: ["5678:5678"]
    depends_on:
      popeye-scanner:
        condition: service_healthy
      dify-lite:
        condition: service_healthy
      slack-receiver:
        condition: service_healthy
    environment:
      N8N_RUNNER_HOST: "0.0.0.0"
      N8N_RUNNER_PORT: "5678"
      POPEYE_URL: "http://popeye-scanner:8004"
      DIFY_LITE_URL: "http://dify-lite:8002"
      MOCK_SLACK_URL: "http://slack-receiver:8003"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5678/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [aops-net]

  # ------------------------------------------------------------------
  # Real Prometheus + Alertmanager
  # ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: aops-prometheus
    profiles: ["monitoring"]
    ports: ["9090:9090"]
    volumes:
      - ./services/prometheus-alertmanager/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./services/prometheus-alertmanager/config/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
      - "--web.enable-remote-write-receiver"
    networks: [aops-net]

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: aops-alertmanager
    profiles: ["monitoring"]
    ports: ["9093:9093"]
    volumes:
      - ./services/prometheus-alertmanager/config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--web.external-url=http://localhost:9093"
    depends_on:
      n8n:
        condition: service_started
    networks: [aops-net]

  # ------------------------------------------------------------------
  # Remediation Executor — applies REAL kubectl fixes
  # ------------------------------------------------------------------
  remediation-executor:
    build: ./services/remediation-executor
    image: aops/remediation-executor:0.2
    container_name: aops-remediation-executor
    ports: ["8005:8005"]
    environment:
      REMEDIATION_HOST: "0.0.0.0"
      REMEDIATION_PORT: "8005"
      POPEYE_URL: "http://popeye-scanner:8004"
      DIFY_LITE_URL: "http://dify-lite:8002"
      AOPS_NAMESPACE: "payment-prod"
      AOPS_SETTLE_SECONDS: "${AOPS_SETTLE_SECONDS:-5}"
      # Dry by default. Set DRY_RUN=0 deliberately to let it mutate a cluster;
      # even then it refuses to act on a report whose data_source is not
      # "live-cluster".
      DRY_RUN: "${DRY_RUN:-1}"
    volumes:
      - ${KUBECONFIG_PATH:-./.kubeconfig.internal}:/root/.kube/config:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [aops-net]

volumes:
  ollama-models:
  n8n-data:
  prometheus-data:

networks:
  aops-net:
    driver: bridge
